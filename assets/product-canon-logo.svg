<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Product Canon</title>
  <desc id="desc">A canonical product document held inside a decision ring.</desc>
  <defs>
    <linearGradient id="background" x1="72" y1="48" x2="438" y2="466" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17213D"/>
      <stop offset="1" stop-color="#0B1024"/>
    </linearGradient>
    <linearGradient id="ring" x1="128" y1="136" x2="388" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63E6D6"/>
      <stop offset="0.52" stop-color="#7B8CFF"/>
      <stop offset="1" stop-color="#C58BFF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(256 242) rotate(90) scale(176)">
      <stop stop-color="#6F8CFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6F8CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="126" y="112" width="260" height="292" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="330" y="114" width="64" height="64" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="124" fill="#070B18"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#background)"/>
  <circle cx="256" cy="242" r="176" fill="url(#halo)"/>

  <path d="M359 157a151 151 0 1 0 12 164" fill="none" stroke="url(#ring)" stroke-linecap="round" stroke-width="30"/>
  <circle cx="359" cy="157" r="28" fill="#F4C978" opacity="0.3" filter="url(#glow)"/>
  <circle cx="359" cy="157" r="16" fill="#F4C978" stroke="#FFF2C7" stroke-width="5"/>

  <g filter="url(#shadow)">
    <rect x="158" y="132" width="196" height="248" rx="40" fill="#F5F8FF"/>
    <path d="M158 172c0-22.091 17.909-40 40-40h116c22.091 0 40 17.909 40 40v34H158v-34Z" fill="#FFFFFF"/>
    <circle cx="204" cy="169" r="12" fill="#6678F4"/>
    <circle cx="238" cy="169" r="12" fill="#6FE0CF"/>
    <rect x="194" y="238" width="124" height="14" rx="7" fill="#1C2949"/>
    <rect x="194" y="278" width="92" height="14" rx="7" fill="#8390AE"/>
    <rect x="194" y="318" width="108" height="14" rx="7" fill="#B5BED0"/>
    <path d="m299 169 12 12 22-25" fill="none" stroke="#17213D" stroke-linecap="round" stroke-linejoin="round" stroke-width="8"/>
  </g>
</svg>
